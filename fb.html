html { min-height:100%; background:#101827; }
body { box-sizing:border-box; margin:0; min-height:100vh; min-height:100svh; color:#f4f7fc; background:radial-gradient(ellipse at 84% 50%,rgba(46,208,210,.055),transparent 56%),#101827; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
.fmb-scene { position:fixed; inset:0; overflow:hidden; pointer-events:none; }
.fmb-scene::before { content:""; position:absolute; inset:24px; border:1px solid rgba(168,183,201,.07); }
.fmb-pitch { position:absolute; top:50%; right:-240px; width:660px; height:auto; transform:translateY(-50%) rotate(-18deg); color:#2ed0d2; opacity:.075; }
.fmb-stage { position:relative; box-sizing:border-box; min-height:100vh; min-height:100svh; padding:76px 24px 108px; display:flex; align-items:center; justify-content:center; }
.fmb-content { width:100%; max-width:560px; text-align:center; }
.fmb-logo { display:block; width:240px; max-width:80%; height:auto; margin:0 auto 42px; }
.fmb-eyebrow { margin:0 0 13px; color:#48dce3; font-size:11px; line-height:1.4; font-weight:650; letter-spacing:2px; text-transform:uppercase; }
.fmb-content h1 { margin:0; color:#f4f7fc; font-size:clamp(36px,5vw,48px); font-weight:750; line-height:1.16; letter-spacing:-1.8px; }
.fmb-description { max-width:355px; margin:18px auto 0; color:#a8b7c9; font-size:16px; line-height:1.7; }
.fmb-widget { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:76px; margin:30px auto 20px; width:100%; }
.fmb-note { max-width:340px; margin:0 auto; color:#9baabe; font-size:13px; line-height:1.65; }
.fmb-divider { width:40px; height:2px; margin:32px auto 0; background:#2ed0d2; opacity:.65; }
.fmb-footer { position:absolute; bottom:34px; left:24px; right:24px; text-align:center; color:#7f91a7; font-size:11px; line-height:1.8; }
.fmb-credit { display:flex; gap:7px; align-items:center; justify-content:center; margin:0; }
.fmb-credit svg { width:12px; height:14px; }
.fmb-footer details { margin-top:4px; }
.fmb-footer summary { cursor:pointer; display:inline-block; list-style:none; color:#7f91a7; }
.fmb-footer summary::-webkit-details-marker { display:none; }
.fmb-footer summary:hover { color:#c6d6e6; }
.fmb-footer summary:focus-visible { outline:2px solid #48dce3; outline-offset:3px; }
.fmb-footer summary::after { content:" +"; color:#48dce3; }
.fmb-footer details[open] summary::after { content:" −"; }
.fmb-reference { margin:3px 0 0; overflow-wrap:anywhere; font-family:inherit; }
.fmb-nojs { max-width:360px; margin:22px auto; padding:12px; border:1px solid #857347; color:#f4d49c; border-radius:4px; font-size:14px; line-height:1.5; }
@media(max-width:600px) {
 .fmb-scene::before { inset:12px; }
 .fmb-pitch { width:450px; right:-325px; opacity:.045; }
 .fmb-stage { padding:60px 20px 110px; }
 .fmb-logo { width:216px; margin-bottom:36px; }
 .fmb-content h1 { letter-spacing:-1.3px; }
 .fmb-description { font-size:15px; max-width:305px; }
 .fmb-footer { bottom:26px; }
}
@media(max-width:359px) {
 .fmb-stage { padding-left:10px; padding-right:10px; }
 .fmb-scene::before { border:0; }
 .fmb-description,.fmb-note { max-width:280px; }
}
@media(max-height:650px) {
 .fmb-stage { min-height:650px; padding-top:44px; }
 .fmb-logo { margin-bottom:28px; }
 .fmb-footer { bottom:22px; }
}
